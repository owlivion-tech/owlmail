  <!-- Right eye outer -->
  <circle cx="65" cy="45" r="18" fill="#080408"/>
  <!-- Left eye inner -->
  <circle cx="35" cy="45" r="12" fill="url(#glowGrad)"/>
  <!-- Right eye inner -->
  <circle cx="65" cy="45" r="12" fill="url(#glowGrad)"/>
  <!-- Left pupil -->
  <circle cx="38" cy="43" r="5" fill="#080408"/>
  <!-- Right pupil -->
  <circle cx="68" cy="43" r="5" fill="#080408"/>
  <!-- Left eye shine -->
  <circle cx="33" cy="41" r="3" fill="#F0E8F0" opacity="0.9"/>
  <!-- Right eye shine -->
  <circle cx="63" cy="41" r="3" fill="#F0E8F0" opacity="0.9"/>
